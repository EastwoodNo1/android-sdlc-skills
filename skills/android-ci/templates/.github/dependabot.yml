version: 2
updates:
  - package-ecosystem: gradle
    directories:
      - /
      - /build-logic/checks
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: build
      include: scope
    labels:
      - dependencies
    groups:
      gradle:
        patterns:
          - "*"
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: ci
      include: scope
    labels:
      - dependencies
    groups:
      github-actions:
        patterns:
          - "*"
